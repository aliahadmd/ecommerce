name: ecommerce

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    # No init scripts: migration 0003_enable_extensions creates pg_trgm and
    # vector, so a fresh or external database converges the same way.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: ecommerce-seaweedfs
    command: >-
      server -dir=/data -ip=seaweedfs
      -master.port=9333 -volume.port=8080
      -filer -filer.port=8888
      -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024
    ports:
      - "9333:9333"
      - "8333:8333"
      - "8888:8888"
    volumes:
      - seaweed_data:/data
    # Inline config: Compose copies it into the container, so no host file
    # is bind-mounted (bind mounts fail when Docker can't share the drive
    # the repo lives on, e.g. an external disk that also holds Docker's data).
    configs:
      - source: seaweedfs_s3
        target: /etc/seaweedfs/s3.json
    depends_on: []

  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce-mailpit
    environment:
      MP_MAX_MESSAGES: 5000
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  redis_data:
  seaweed_data:
  mailpit_data:

configs:
  # S3 identities for local dev (keys match .env.example S3_ACCESS_KEY/SECRET)
  seaweedfs_s3:
    content: |
      {
        "identities": [
          {
            "name": "ecommerce",
            "credentials": [
              { "accessKey": "ecommerce-dev", "secretKey": "ecommerce-dev-secret" }
            ],
            "actions": ["Admin", "Read", "Write", "List"]
          },
          {
            "name": "anonymous",
            "actions": ["Read"]
          }
        ]
      }
