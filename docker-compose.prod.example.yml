# Reference only — production is deployed via Dokploy (see README "Deploying
# later"). This file shows the env wiring against EXTERNAL services; the app
# image is built from the repo Dockerfile.
name: ecommerce-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL} # external managed Postgres 17 + pgvector
      REDIS_URL: ${REDIS_URL} # external Redis 7
      S3_ENDPOINT: ${S3_ENDPOINT} # external S3 (or SeaweedFS/Minio)
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      SMTP_HOST: ${SMTP_HOST} # external SMTP provider
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AI_MODEL: ${AI_MODEL:-z-ai/glm-4.6}
      CURRENCY: ${CURRENCY:-USD}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
